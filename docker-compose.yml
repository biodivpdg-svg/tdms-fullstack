version: '3.8'

services:

  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tdms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       tdms
      POSTGRES_USER:     tdms_user
      POSTGRES_PASSWORD: tdms_pass_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdms_user -d tdms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tdms-backend
    restart: unless-stopped
    environment:
      PORT:        3001
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     tdms
      DB_USER:     tdms_user
      DB_PASSWORD: tdms_pass_2024
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
